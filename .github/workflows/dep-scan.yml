
name: OWASP Dependency Scan

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-scan:
    name: OWASP dep-scan
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Prepare writable directories
      - name: Prepare scan directories
        run: |
          mkdir -p "$RUNNER_TEMP/dep-scan-vdb"
          mkdir -p reports
          chmod 777 "$RUNNER_TEMP/dep-scan-vdb"
          chmod 777 reports

      # 3. Download OWASP dep-scan image
      - name: Pull OWASP dep-scan image
        run: |
          docker pull ghcr.io/owasp-dep-scan/dep-scan:latest

      # 4. Run OWASP dependency scan
      - name: Run OWASP dep-scan
        run: |
          docker run --rm \
            -e VDB_HOME=/db \
            -v "$GITHUB_WORKSPACE:/app" \
            -v "$RUNNER_TEMP/dep-scan-vdb:/db" \
            ghcr.io/owasp-dep-scan/dep-scan:latest \
            depscan \
              --src /app \
              --reports-dir /app/reports \
              --vdb-scope app

      # 5. Upload scan reports
      - name: Upload OWASP scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-depscan-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 30

