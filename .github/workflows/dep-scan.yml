
name: OWASP Dependency Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-scan:
    name: OWASP dep-scan
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Scan Directories
        run: |
          mkdir -p reports
          mkdir -p "$RUNNER_TEMP/depscan-vdb"

      - name: Cache Vulnerability Database
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/depscan-vdb
          key: depscan-vdb-app-v1
          restore-keys: |
            depscan-vdb-app-

      - name: Pull OWASP dep-scan Image
        run: |
          docker pull ghcr.io/owasp-dep-scan/dep-scan:latest

      - name: Download Application Vulnerability Database
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker run --rm \
            -e VDB_HOME=/db \
            -e GITHUB_TOKEN="$GITHUB_TOKEN" \
            -v "$RUNNER_TEMP/depscan-vdb:/db" \
            ghcr.io/owasp-dep-scan/dep-scan:latest \
            depscan-vdb download --scope app

      - name: Run OWASP Dependency Scan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker run --rm \
            -e VDB_HOME=/db \
            -e GITHUB_TOKEN="$GITHUB_TOKEN" \
            -v "$RUNNER_TEMP/depscan-vdb:/db" \
            -v "$GITHUB_WORKSPACE:/app" \
            ghcr.io/owasp-dep-scan/dep-scan:latest \
            depscan --src /app --reports-dir /app/reports

      - name: Upload OWASP Scan Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-depscan-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 30
